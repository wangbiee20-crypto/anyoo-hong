<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>
      <img class="logo" src="logo.webp" alt="오늘의 할 일">
      <img class="mascot" src="mascot.jpg" alt="마스코트">
    </h1>
    <section id="calendar">
      <div id="calendar-header">
        <button type="button" id="prev-month">◀</button>
        <h2 id="calendar-title"></h2>
        <button type="button" id="next-month">▶</button>
      </div>
      <div id="calendar-grid"></div>
    </section>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="할 일을 적어 주세요" autocomplete="off">
      <button type="submit">추가</button>
    </form>
    <p id="remaining-count"></p>
    <ul id="todo-list"></ul>
    <p id="empty-message">아직 할 일이 없어요.</p>
    <section id="deleted-section">
      <h2>삭제한 할 일</h2>
      <ul id="deleted-list"></ul>
      <p id="deleted-empty">아직 삭제한 할 일이 없어요.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
