<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>할 일 목록</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="할 일을 적어 주세요" autocomplete="off">
      <button type="submit">추가</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="empty-message">아직 할 일이 없어요.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
